<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Joalor64's Website - Mods</title>
    <meta name="author" content="Joalor64">
    <meta name="description" content="Joalor64's Incredibox mods: versions, characters, previews, and downloads.">
    <meta name="theme-color" content="#0000ff">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Joalor64's Website">
    <meta property="og:url" content="https://joalor64.github.io/projects/mod">
    <meta property="og:title" content="Joalor64's Website - Mods">
    <meta property="og:description" content="Joalor64's Incredibox mods: versions, characters, previews, and downloads.">
    <meta property="og:image" content="https://joalor64.github.io/img/social-card.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Joalor64's Website">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" href="/img/favicon-64.png" type="image/png">
    <script>(function () { var d = document.documentElement; d.classList.add("preload"); try { if (localStorage.getItem("lightmode") === "enabled") d.classList.add("lightmode"); } catch (e) { } })();</script>
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/mod.css">
</head>

<body>
    <div id="topnav-container"></div>
    <main>
    <h1 class="logo">Mods</h1>
    <p class="sub-head">Loading...</p>
    <hr>
    <h2 id="header" class="headerMove">
        <span class="header-text">Select a Version</span>
        <a class="header-back" href="" hidden>Back to Main Page</a>
    </h2>

    <div class="fvbxVersionsArray">
        <div class="foreverbox-icons-row" id="versionIcons"></div>
    </div>

    <div id="version-view" hidden>
        <hr id="version-hr">
        <br>
        <div id="version-dynamic-content"></div>
        <div id="characters-header">
            <h2 class="hr-container"><span>• Characters •</span></h2>
        </div>
        <div id="characters-grid"></div>
    </div>
    </main>

    <div id="downloadModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="downloadModalTitle" hidden>
        <div class="modal-content">
            <button type="button" class="close-btn" data-close aria-label="Close">&times;</button>
            <h2 id="downloadModalTitle">Select your Platform</h2>
            <div class="modal-buttons">
                <a id="windowsDownload" aria-label="Download for Windows">
                    <span class="platform-icon" data-type="windows"></span>
                </a>
                <a id="androidDownload" aria-label="Download for Android">
                    <span class="platform-icon" data-type="android"></span>
                </a>
                <a id="modIoDownload" aria-label="Get it on mod.io">
                    <span class="platform-icon" data-type="modio"></span>
                </a>
            </div>
        </div>
    </div>
    <div id="previewModal" class="modal" role="dialog" aria-modal="true" aria-label="Preview video" hidden>
        <div class="modal-content preview-modal-content">
            <button type="button" class="close-btn" data-close aria-label="Close">&times;</button>
            <!-- The video <iframe> is created when the modal opens (see js/mod.js) -->
            <div class="video-wrapper" id="previewVideoWrap"></div>
        </div>
    </div>
    <div id="blankIconModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="blankModalTitle" hidden>
        <div class="modal-content">
            <button type="button" class="close-btn" data-close aria-label="Close">&times;</button>
            <h2 id="blankModalTitle">Hey you!</h2>
            <p>This version is not available.</p>
        </div>
    </div>

    <script src="/js/script.js"></script>
    <script src="/js/mod.js"></script>
</body>

</html>
