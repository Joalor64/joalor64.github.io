<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Joalor64's Website - Radio Chat</title>
    <meta name="author" content="Joalor64">
    <meta name="description" content="Listen to my music and chat with others!">
    <meta name="theme-color" content="#0000ff">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Joalor64's Website">
    <meta property="og:url" content="https://joalor64.github.io/radio">
    <meta property="og:title" content="Joalor64's Website - Radio Chat">
    <meta property="og:description" content="Listen to my music and chat with others!">
    <meta property="og:image" content="https://joalor64.github.io/img/social-card.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Joalor64's Website">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" href="/img/favicon-64.png" type="image/png">
    <script>(function () { var d = document.documentElement; d.classList.add("preload"); try { if (localStorage.getItem("lightmode") === "enabled") d.classList.add("lightmode"); } catch (e) { } })();</script>
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/radio.css">
</head>

<body>
    <div id="topnav-container"></div>
    <main class="radio-shell">
        <header class="radio-header">
            <h1 class="header">Radio Chat</h1>
            <p class="sub-head">Listen to some music and chat with others!</p>
        </header>
        <hr>
        <div class="outer-container">
            <div class="content-container radio-layout">
                <section class="music-player" aria-label="Radio player">
                    <h2>📻 Joalor64's Radio Player™ 📻</h2>

                    <div class="radio-ui">
                        <div class="playlist-controls">
                            <label for="playlist-select">Playlist</label>
                            <select id="playlist-select">
                                <option value="default">Default</option>
                                <option value="legacy">Legacy</option>
                            </select>

                            <label for="song-select">Song</label>
                            <select id="song-select"></select>
                        </div>

                        <div class="track-info" aria-live="polite">
                            <p id="track-title">Now Playing: Ascending the Mountains</p>
                        </div>

                        <audio id="audio-player" preload="metadata"></audio>

                        <div class="progress-wrap">
                            <div id="progress-bar" class="progress-bar" role="slider" aria-label="Seek"
                                aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="0:00"
                                tabindex="0"></div>
                            <div class="time-info">
                                <span id="current-time">0:00</span>
                                <span id="duration-time">0:00</span>
                            </div>
                        </div>

                        <div class="controls" role="group" aria-label="Player controls">
                            <button id="prev-btn" type="button" aria-label="Previous track">⏮ Previous</button>
                            <button id="play-btn" type="button" aria-label="Play">▶ Play</button>
                            <button id="pause-btn" type="button" aria-label="Pause" hidden>⏸ Pause</button>
                            <button id="next-btn" type="button" aria-label="Next track">⏭ Next</button>

                            <div class="volume-control">
                                <label for="volume-slider">🔊 Volume:</label>
                                <input id="volume-slider" type="range" min="0" max="1" step="0.05" value="0.8">
                            </div>
                        </div>
                    </div>
                </section>

                <div class="chat-embed-wrap">
                    <iframe class="chat-embed" src="https://joalor64-chatroom.onrender.com" title="Chat room"
                        loading="lazy"></iframe>
                </div>
            </div>
        </div>
    </main>

    <script src="/js/script.js"></script>
    <script src="/js/radio.js"></script>
</body>

</html>
